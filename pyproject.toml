[project]
name = "airport-popularity"
version = "0.1.0"
description = "Estimate airport airspace busyness from ADS-B data (OpenSky)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "opensky-api @ git+https://github.com/openskynetwork/opensky-api.git#subdirectory=python",
]

[project.scripts]
poll = "airpop.poll:main"
collect = "airpop.collector:main"
sample = "airpop.fixtures:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["airpop"]
