<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__CHART_TITLE__</title>
  __REFRESH_META__
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* --- Theme (tweak these) --- */
    :root {
      --font-display: "Barlow Condensed", sans-serif;
      --font: "Source Sans 3", system-ui, sans-serif;
      --ink: #0b2430;
      --ink-muted: #3d5c6a;
      --sky-top: #c5e4ef;
      --sky-mid: #e7f3f7;
      --sky-bottom: #f4f8fa;
      --horizon: #7eb8c9;
      --bar-default: #1d6b8a;
      --bar-current: #e07a2f;
      --bar-typical: #a8c5d0;
      --bar-measured-opacity: 0.72;
      --grid: rgba(11, 36, 48, 0.08);
      --nav-link: var(--ink);
      --nav-disabled: #9bb0ba;
      --hit: 2.75rem;
    }
    /* ----------------------------------- */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(120% 60% at 50% -10%, rgba(255, 255, 255, 0.55), transparent 55%),
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 38%, var(--sky-bottom) 100%);
      min-height: 100dvh;
    }
    #wrap {
      width: min(100%, 52rem);
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: clamp(1rem, 4vw, 1.75rem) clamp(0.75rem, 3vw, 1.25rem) 1.5rem;
    }
    .mast {
      animation: mast-in 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.75rem, 14vw, 5.5rem);
      line-height: 0.92;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      width: 100%;
    }
    .day-nav {
      display: grid;
      grid-template-columns: var(--hit) 1fr auto;
      align-items: center;
      gap: 0.35rem;
      width: 100%;
      margin: clamp(0.85rem, 3vw, 1.35rem) 0 clamp(1rem, 3vw, 1.5rem);
      padding: 0.35rem 0 0.85rem;
      border-bottom: 2px solid color-mix(in srgb, var(--horizon) 55%, transparent);
      animation: mast-in 560ms cubic-bezier(0.22, 1, 0.36, 1) 60ms both;
    }
    .day-nav-forward {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.1rem;
    }
    .day-nav a,
    .day-nav .disabled {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: var(--hit);
      min-height: var(--hit);
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 600;
      line-height: 1;
      text-decoration: none;
      color: var(--nav-link);
      border-radius: 0.4rem;
      transition: transform 120ms ease, background 120ms ease;
    }
    .day-nav a:active { transform: scale(0.92); }
    .day-nav a:hover { background: rgba(255, 255, 255, 0.35); }
    .day-nav .disabled {
      color: var(--nav-disabled);
      user-select: none;
    }
    .day-nav .date-label {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.35rem, 5.5vw, 2rem);
      letter-spacing: 0.04em;
      text-align: center;
      text-transform: uppercase;
      color: var(--ink-muted);
      padding: 0 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chart-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 14rem;
      animation: chart-in 640ms cubic-bezier(0.22, 1, 0.36, 1) 120ms both;
    }
    .chart-stage canvas {
      width: 100% !important;
      max-height: min(58dvh, 28rem);
    }
    @keyframes mast-in {
      from { opacity: 0; transform: translateY(0.6rem); }
      to { opacity: 1; transform: none; }
    }
    @keyframes chart-in {
      from { opacity: 0; transform: translateY(1rem); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mast, .day-nav, .chart-stage { animation: none; }
      .day-nav a:active { transform: none; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <header class="mast">
      <h1>__CHART_TITLE__</h1>
      <nav class="day-nav" aria-label="Day">
        <a class="day-nav-prev" href="__PREV_HREF__" aria-label="Previous day">‹</a>
        <span class="date-label">__DATE_LABEL__</span>
        <div class="day-nav-forward">
          __NEXT_HTML__
          __TODAY_HTML__
        </div>
      </nav>
    </header>
    <div class="chart-stage">
      <canvas id="chart" height="160"></canvas>
    </div>
  </div>
  <script>
    const axisLabels = __AXIS_LABELS_JSON__;
    const hourLabels = __HOUR_LABELS_JSON__;
    const counts = __COUNTS_JSON__;
    const typical = __TYPICAL_JSON__;
    const barRoles = __BAR_ROLES_JSON__;
    const css = getComputedStyle(document.documentElement);
    const measuredOpacity = css.getPropertyValue("--bar-measured-opacity").trim() || "0.7";
    const barColor = (role) =>
      css.getPropertyValue(`--bar-${role}`).trim() || css.getPropertyValue("--bar-default").trim();
    const withOpacity = (color, opacity) => {
      const hex = color.trim();
      if (hex.startsWith("#") && (hex.length === 7 || hex.length === 4)) {
        const full = hex.length === 4
          ? `#${hex[1]}${hex[1]}${hex[2]}${hex[2]}${hex[3]}${hex[3]}`
          : hex;
        const r = parseInt(full.slice(1, 3), 16);
        const g = parseInt(full.slice(3, 5), 16);
        const b = parseInt(full.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${opacity})`;
      }
      return color;
    };
    const measuredColors = barRoles.map((role) => withOpacity(barColor(role), measuredOpacity));
    const typicalColor = css.getPropertyValue("--bar-typical").trim() || "#94a3b8";
    const tickColor = css.getPropertyValue("--ink-muted").trim() || "#3d5c6a";
    new Chart(document.getElementById("chart"), {
      type: "bar",
      data: {
        labels: axisLabels,
        datasets: [
          {
            label: "Typical",
            data: typical,
            backgroundColor: typicalColor,
            borderWidth: 0,
            borderRadius: 4,
            barPercentage: 0.85,
            categoryPercentage: 0.9,
            order: 2,
          },
          {
            label: "Measured",
            data: counts,
            backgroundColor: measuredColors,
            borderWidth: 0,
            borderRadius: 4,
            barPercentage: 0.85,
            categoryPercentage: 0.9,
            order: 1,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        datasets: {
          bar: { grouped: false },
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: (items) => hourLabels[items[0].dataIndex],
              label: (ctx) => {
                const y = ctx.parsed.y;
                if (y == null) return null;
                if (ctx.dataset.label === "Typical") {
                  return `Typical: ${Number.isInteger(y) ? y : y.toFixed(1)}`;
                }
                return `Peak traffic count: ${y}`;
              },
            },
          },
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: {
              autoSkip: false,
              maxRotation: 0,
              color: tickColor,
              font: { family: "'Source Sans 3', sans-serif", size: 11 },
            },
          },
          y: {
            beginAtZero: true,
            ticks: {
              precision: 0,
              color: tickColor,
              font: { family: "'Source Sans 3', sans-serif", size: 11 },
            },
            grid: { color: css.getPropertyValue("--grid").trim() },
          },
        },
      },
    });
  </script>
</body>
</html>
