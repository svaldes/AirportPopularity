<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>__CHART_TITLE__</title>
  __REFRESH_META__
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* --- Theme (tweak these) --- */
    :root {
      --font: system-ui, sans-serif;
      --bar-default: #2563eb;
      --bar-current: #f59e0b;
      --grid: rgba(0, 0, 0, 0.06);
    }
    /* ----------------------------------- */
    body { font-family: var(--font); margin: 1.5rem; }
    #wrap { max-width: 900px; }
  </style>
</head>
<body>
  <div id="wrap">
    <h1>__CHART_TITLE__</h1>
    <p>Aircraft in __AIRPORT_ICAO__ airspace</p>
    <canvas id="chart" height="120"></canvas>
  </div>
  <script>
    const axisLabels = __AXIS_LABELS_JSON__;
    const hourLabels = __HOUR_LABELS_JSON__;
    const counts = __COUNTS_JSON__;
    const barRoles = __BAR_ROLES_JSON__;
    const css = getComputedStyle(document.documentElement);
    const barColor = (role) =>
      css.getPropertyValue(`--bar-${role}`).trim() || css.getPropertyValue("--bar-default").trim();
    const barColors = barRoles.map(barColor);
    new Chart(document.getElementById("chart"), {
      type: "bar",
      data: {
        labels: axisLabels,
        datasets: [{
          label: "Count",
          data: counts,
          backgroundColor: barColors,
          borderWidth: 0,
          borderRadius: 4,
          barPercentage: 0.85,
          categoryPercentage: 0.9,
        }],
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: (items) => hourLabels[items[0].dataIndex],
              label: (ctx) => `Max aircraft: ${ctx.parsed.y}`,
            },
          },
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { autoSkip: false, maxRotation: 0 },
          },
          y: {
            beginAtZero: true,
            ticks: { precision: 0 },
            grid: { color: css.getPropertyValue("--grid").trim() },
          },
        },
      },
    });
  </script>
</body>
</html>
