<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>__CHART_TITLE__</title>
  __REFRESH_META__
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* --- Theme (tweak these) --- */
    :root {
      --font: system-ui, sans-serif;
      --bar-default: #2563eb;
      --bar-current: #f59e0b;
      --bar-typical: #94a3b8;
      --bar-measured-opacity: 0.7;
      --grid: rgba(0, 0, 0, 0.06);
      --nav-link: #2563eb;
      --nav-disabled: #94a3b8;
    }
    /* ----------------------------------- */
    body { font-family: var(--font); margin: 1.5rem; }
    #wrap { max-width: 900px; }
    .day-nav {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 0.75rem 0 1.25rem;
      font-size: 1.1rem;
    }
    .day-nav a {
      color: var(--nav-link);
      text-decoration: none;
      font-size: 1.75rem;
      line-height: 1;
      padding: 0 0.25rem;
    }
    .day-nav .disabled {
      color: var(--nav-disabled);
      font-size: 1.75rem;
      line-height: 1;
      padding: 0 0.25rem;
      user-select: none;
    }
    .day-nav .date-label { font-weight: 600; }
  </style>
</head>
<body>
  <div id="wrap">
    <h1>__CHART_TITLE__</h1>
    <p>Aircraft in __AIRPORT_ICAO__ airspace</p>
    <nav class="day-nav" aria-label="Day">
      <a class="day-nav-prev" href="__PREV_HREF__" aria-label="Previous day">‹</a>
      <span class="date-label">__DATE_LABEL__</span>
      __NEXT_HTML__
    </nav>
    <canvas id="chart" height="120"></canvas>
  </div>
  <script>
    const axisLabels = __AXIS_LABELS_JSON__;
    const hourLabels = __HOUR_LABELS_JSON__;
    const counts = __COUNTS_JSON__;
    const typical = __TYPICAL_JSON__;
    const barRoles = __BAR_ROLES_JSON__;
    const css = getComputedStyle(document.documentElement);
    const measuredOpacity = css.getPropertyValue("--bar-measured-opacity").trim() || "0.7";
    const barColor = (role) =>
      css.getPropertyValue(`--bar-${role}`).trim() || css.getPropertyValue("--bar-default").trim();
    const withOpacity = (color, opacity) => {
      const hex = color.trim();
      if (hex.startsWith("#") && (hex.length === 7 || hex.length === 4)) {
        const full = hex.length === 4
          ? `#${hex[1]}${hex[1]}${hex[2]}${hex[2]}${hex[3]}${hex[3]}`
          : hex;
        const r = parseInt(full.slice(1, 3), 16);
        const g = parseInt(full.slice(3, 5), 16);
        const b = parseInt(full.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${opacity})`;
      }
      return color;
    };
    const measuredColors = barRoles.map((role) => withOpacity(barColor(role), measuredOpacity));
    const typicalColor = css.getPropertyValue("--bar-typical").trim() || "#94a3b8";
    new Chart(document.getElementById("chart"), {
      type: "bar",
      data: {
        labels: axisLabels,
        datasets: [
          {
            label: "Typical",
            data: typical,
            backgroundColor: typicalColor,
            borderWidth: 0,
            borderRadius: 4,
            barPercentage: 0.85,
            categoryPercentage: 0.9,
            order: 2,
          },
          {
            label: "Measured",
            data: counts,
            backgroundColor: measuredColors,
            borderWidth: 0,
            borderRadius: 4,
            barPercentage: 0.85,
            categoryPercentage: 0.9,
            order: 1,
          },
        ],
      },
      options: {
        responsive: true,
        datasets: {
          bar: { grouped: false },
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: (items) => hourLabels[items[0].dataIndex],
              label: (ctx) => {
                const y = ctx.parsed.y;
                if (y == null) return null;
                if (ctx.dataset.label === "Typical") {
                  return `Typical: ${Number.isInteger(y) ? y : y.toFixed(1)}`;
                }
                return `Peak traffic count: ${y}`;
              },
            },
          },
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { autoSkip: false, maxRotation: 0 },
          },
          y: {
            beginAtZero: true,
            ticks: { precision: 0 },
            grid: { color: css.getPropertyValue("--grid").trim() },
          },
        },
      },
    });
  </script>
</body>
</html>
