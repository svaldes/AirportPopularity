<!DOCTYPE html>
<html lang="en"__HTML_CLASS__>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__CHART_TITLE__</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* --- Theme (tweak these) --- */
    /* Default inks follow sectional-chart colors (IAC-2). Swap fonts here;
       Chart.js ticks read --font. Oswald is a free stand-in for Alternate Gothic. */
    :root {
      --font-display: Oswald, "Helvetica Neue Condensed", "Arial Narrow", sans-serif;
      --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --ink: #2e2628;
      --ink-muted: #275d8c;
      --sky-top: #bed7e5;
      --sky-mid: #bed7e5;
      --sky-bottom: #bed7e5;
      --horizon: #006ea1;
      --bar-default: #1d6b8a;
      --bar-current: #e07a2f;
      --bar-typical: #1d6b8a;
      --bar-measured-opacity: 1;
      --bar-typical-opacity: 0.4;
      --grid: rgba(0, 110, 161, 0.14);
      --nav-link: var(--ink-muted);
      --nav-hover: rgba(129, 59, 94, 0.12);
      --nav-disabled-opacity: 0.4;
      --hit: 2.75rem;
    }
    /* ----------------------------------- */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-bottom) 100%);
      min-height: 100dvh;
    }
    #wrap {
      width: min(100%, 52rem);
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: clamp(1rem, 4vw, 1.75rem) clamp(0.75rem, 3vw, 1.25rem) 1.5rem;
    }
    .mast {
      position: relative;
      z-index: 2;
      animation: mast-in 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.05rem, 3.8vw, 1.35rem);
      line-height: 1.1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      color: var(--ink-muted);
      width: 100%;
    }
    .info-btn {
      position: absolute;
      top: 0;
      right: 0;
      width: 1.15rem;
      height: 1.15rem;
      padding: 0;
      border: 1.5px solid var(--ink-muted);
      border-radius: 50%;
      background: transparent;
      color: var(--ink-muted);
      font-family: var(--font);
      font-size: 0.7rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
    }
    .info-tip {
      position: absolute;
      top: calc(100% + 0.35rem);
      right: 0;
      z-index: 3;
      width: max-content;
      max-width: calc(100% - 0.5rem);
      margin: 0;
      padding: 0.4rem 0.5rem;
      font-family: var(--font);
      font-size: 0.72rem;
      line-height: 1.35;
      color: var(--ink);
      background: #f4f8fa;
      border: 1px solid var(--horizon);
      border-radius: 0.25rem;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 120ms ease, visibility 120ms ease;
    }
    .info-tip::before {
      content: "";
      position: absolute;
      top: -0.4rem;
      right: 0;
      left: 0;
      height: 0.4rem;
    }
    .info-btn[aria-expanded="true"] + .info-tip {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .info-tip a {
      color: var(--ink-muted);
    }
    .day-nav {
      display: grid;
      grid-template-columns: var(--hit) 1fr auto;
      align-items: center;
      gap: 0.35rem;
      width: 100%;
      flex-shrink: 0;
      margin: 0.65rem 0 0;
      padding: 0.55rem 0 0;
      border-top: 2px solid color-mix(in srgb, var(--horizon) 55%, transparent);
      animation: mast-in 560ms cubic-bezier(0.22, 1, 0.36, 1) 60ms both;
    }
    .day-nav-forward {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.35rem;
    }
    .day-nav svg {
      height: 1.15rem;
      width: auto;
      display: block;
    }
    .day-nav-prev svg {
      transform: scaleX(-1);
    }
    .day-nav a,
    .day-nav .disabled {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: var(--hit);
      min-height: var(--hit);
      text-decoration: none;
      color: var(--nav-link);
      border-radius: 0.35rem;
      transition: transform 120ms ease, background 120ms ease;
    }
    .day-nav a:active { transform: scale(0.92); }
    .day-nav a:hover { background: var(--nav-hover); }
    .day-nav .disabled {
      color: var(--ink-muted);
      opacity: var(--nav-disabled-opacity);
      user-select: none;
    }
    .day-nav .date-label {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.35rem, 5.5vw, 2rem);
      letter-spacing: 0.04em;
      text-align: center;
      text-transform: uppercase;
      color: var(--ink-muted);
      padding: 0 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    html.embed {
      --hit: 2.5rem;
    }
    html.embed .day-nav {
      margin: 0.25rem 0 0;
      padding: 0.2rem 0 0;
    }
    html.embed .day-nav .date-label {
      font-size: clamp(0.8rem, 3.8vw, 1.05rem);
    }
    html.embed,
    html.embed body {
      height: 100%;
      overflow: hidden;
    }
    html.embed body {
      min-height: 0;
    }
    html.embed #wrap {
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 0.5rem 0.65rem 0.4rem;
    }
    html.embed .chart-stage {
      min-height: 0;
    }
    html.embed .chart-stage canvas {
      max-height: none;
      flex: 1;
      height: 100% !important;
    }
    .chart-stage {
      position: relative;
      z-index: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 14rem;
      animation: chart-in 640ms cubic-bezier(0.22, 1, 0.36, 1) 120ms both;
    }
    .chart-stage canvas {
      width: 100% !important;
      max-height: min(58dvh, 28rem);
    }
    @keyframes mast-in {
      from { opacity: 0; transform: translateY(0.6rem); }
      to { opacity: 1; transform: none; }
    }
    @keyframes chart-in {
      from { opacity: 0; transform: translateY(1rem); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mast, .day-nav, .chart-stage { animation: none; }
      .day-nav a:active { transform: none; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <header class="mast">
      <h1>__CHART_TITLE__</h1>
      <button type="button" class="info-btn" aria-label="About this chart" aria-expanded="false" aria-controls="chart-info-tip">i</button>
      <p class="info-tip" id="chart-info-tip" role="tooltip">
        <span class="info-updated">__INFO_UPDATED__</span><br>
        ADS-B traffic w/in __DISK_NM__NM, below __CEILING_MSL_FT__MSL.<br>
        <a href="__REPO_URL__" target="_blank" rel="noopener noreferrer">Contribute</a>
      </p>
    </header>
    <div class="chart-stage">
      <canvas id="chart" height="160"></canvas>
    </div>
    <nav class="day-nav" aria-label="Day">
      <a class="day-nav-prev" href="__PREV_HREF__" aria-label="Previous day">__NAV_ARROW__</a>
      <span class="date-label">__DATE_LABEL__</span>
      <div class="day-nav-forward">
        __NEXT_HTML__
        __TODAY_HTML__
      </div>
    </nav>
  </div>
  <script>
    const axisLabels = __AXIS_LABELS_JSON__;
    let hourLabels = __HOUR_LABELS_JSON__;
    const counts = __COUNTS_JSON__;
    const typical = __TYPICAL_JSON__;
    const barRoles = __BAR_ROLES_JSON__;
    const pollSeconds = __POLL_SECONDS__;
    const css = getComputedStyle(document.documentElement);
    const measuredOpacity = css.getPropertyValue("--bar-measured-opacity").trim() || "0.7";
    const barColor = (role) =>
      css.getPropertyValue(`--bar-${role}`).trim() || css.getPropertyValue("--bar-default").trim();
    const withOpacity = (color, opacity) => {
      const hex = color.trim();
      if (hex.startsWith("#") && (hex.length === 7 || hex.length === 4)) {
        const full = hex.length === 4
          ? `#${hex[1]}${hex[1]}${hex[2]}${hex[2]}${hex[3]}${hex[3]}`
          : hex;
        const r = parseInt(full.slice(1, 3), 16);
        const g = parseInt(full.slice(3, 5), 16);
        const b = parseInt(full.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${opacity})`;
      }
      return color;
    };
    const measuredColors = barRoles.map((role) => withOpacity(barColor(role), measuredOpacity));
    const typicalOpacity = css.getPropertyValue("--bar-typical-opacity").trim() || "0.45";
    const typicalColor = withOpacity(
      css.getPropertyValue("--bar-typical").trim() || "#fdf7dd",
      typicalOpacity
    );
    const tickColor = css.getPropertyValue("--ink-muted").trim() || "#275d8c";
    const tickFont = css.getPropertyValue("--font").trim() || "sans-serif";
    const chart = new Chart(document.getElementById("chart"), {
      type: "bar",
      data: {
        labels: axisLabels,
        datasets: [
          {
            label: "Typical",
            data: typical,
            backgroundColor: typicalColor,
            borderWidth: 0,
            borderRadius: 4,
            barPercentage: 0.85,
            categoryPercentage: 0.9,
            minBarLength: 3,
            order: 2,
          },
          {
            label: "Measured",
            data: counts,
            backgroundColor: measuredColors,
            borderWidth: 0,
            borderRadius: 4,
            barPercentage: 0.85,
            categoryPercentage: 0.9,
            minBarLength: 3,
            order: 1,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        datasets: {
          bar: { grouped: false },
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: "index",
            intersect: true,
            callbacks: {
              title: (items) => hourLabels[items[0].dataIndex],
              label: (ctx) => {
                const y = ctx.parsed.y;
                if (y == null) return null;
                if (ctx.dataset.label === "Typical") {
                  return `Typical: ${Number.isInteger(y) ? y : y.toFixed(1)}`;
                }
                return `Peak traffic count: ${y}`;
              },
            },
          },
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: {
              autoSkip: false,
              maxRotation: 0,
              color: tickColor,
              font: { family: tickFont, size: 11 },
            },
          },
          y: {
            beginAtZero: true,
            ticks: {
              precision: 0,
              color: tickColor,
              font: { family: tickFont, size: 11 },
            },
            grid: { color: css.getPropertyValue("--grid").trim() },
          },
        },
      },
    });
    const infoBtn = document.querySelector(".info-btn");
    if (infoBtn) {
      infoBtn.addEventListener("click", () => {
        const open = infoBtn.getAttribute("aria-expanded") === "true";
        infoBtn.setAttribute("aria-expanded", open ? "false" : "true");
      });
    }
    if (pollSeconds > 0) {
      const pollUrl = new URL(window.location.href);
      pollUrl.searchParams.set("poll", "1");
      const applyPayload = (payload) => {
        hourLabels = payload.hour_labels;
        chart.data.labels = payload.axis_labels;
        chart.data.datasets[0].data = payload.typical;
        chart.data.datasets[1].data = payload.counts;
        chart.data.datasets[1].backgroundColor = payload.bar_roles.map((role) =>
          withOpacity(barColor(role), measuredOpacity)
        );
        chart.update("none");
        const dateEl = document.querySelector(".date-label");
        if (dateEl && payload.date_label) dateEl.textContent = payload.date_label;
        const updatedEl = document.querySelector(".info-updated");
        if (updatedEl && payload.updated_label) {
          updatedEl.textContent = payload.updated_label;
        }
      };
      setInterval(() => {
        fetch(pollUrl)
          .then((r) => (r.ok ? r.json() : Promise.reject()))
          .then(applyPayload)
          .catch(() => {});
      }, pollSeconds * 1000);
    }
  </script>
</body>
</html>
